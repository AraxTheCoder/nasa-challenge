# T14: public deploy (https://nasa.jbarkoczi.de/). Start: `docker compose up -d --build` in this folder.
# Reachable only on the WireGuard address; Joerg's AWS nginx terminates TLS and proxies here.
name: spherex-blink
services:
  api:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    command: python -m server --host 0.0.0.0 --port 8000 --public --trust-proxy
    user: "${APP_UID:-1001}:${APP_GID:-1001}"    # same owner as data/ on the host
    environment:
      HOME: /tmp/home                            # astropy / pip caches
      SPHEREX_ADMIN_TOKEN: ${SPHEREX_ADMIN_TOKEN:-}
      SPHEREX_CACHE_GB: ${SPHEREX_CACHE_GB:-12}
      SPHEREX_MAX_JOBS: ${SPHEREX_MAX_JOBS:-4}
    volumes:
      - ../..:/app:ro                            # code from the repo checkout
      - ../../data:/app/data                     # caches, image index, community database (shared with dev runs)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
  web:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports:
      - "${BIND_ADDR:-10.0.0.2}:${PORT:-8090}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../web:/srv/web:ro
      - ../../fixtures:/srv/fixtures:ro
    restart: unless-stopped
