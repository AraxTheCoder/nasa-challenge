# T14: one origin for viewer and Live API (web/api.js then uses location.origin as the API).
server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;            # Location: /web/ (relative): the public side is https, this side http
    client_max_body_size 1m;          # community comments are the only POST bodies
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;

    # "/" (and "/?ra=..&dec=..") opens the viewer, keeping the query: shared links stay short
    location = / { return 302 /web/$is_args$args; }

    location /web/      { root /srv; add_header Cache-Control "no-cache"; }   # revalidate: new JS after a pull
    location /fixtures/ { root /srv; add_header Cache-Control "no-cache"; }
    location ~ /\.      { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the AWS proxy sets X-Forwarded-For to the client address; pass it on unchanged (the API trusts its first entry)
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;      # some answers (labels, spectra of a big field) take a while
    }
}
